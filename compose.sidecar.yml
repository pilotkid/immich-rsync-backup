# Add this service to your existing Immich Docker Compose services.
# The repo can build a local image using: docker build -t immich-rsync-backup:local .
services:
  immich-rsync-backup:
    image: ${BACKUP_IMAGE:-immich-rsync-backup:local}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Denver}
      RSYNC_DESTINATION: ${RSYNC_DESTINATION:?Set RSYNC_DESTINATION in .env}
      RSYNC_PROFILE: ${RSYNC_PROFILE:-standard}
      BACKUP_MODE: ${BACKUP_MODE:-append}
      MEDIA_ROOT: ${MEDIA_ROOT:-/data}
      BACKUP_TIME: ${BACKUP_TIME:-03:00}
      RUN_ON_START: ${RUN_ON_START:-false}
      SOURCE_DIRS: ${SOURCE_DIRS:-upload library profile backups}
      REQUIRE_DB_BACKUP: ${REQUIRE_DB_BACKUP:-true}
      DB_BACKUP_MAX_AGE_HOURS: ${DB_BACKUP_MAX_AGE_HOURS:-48}
      TRIGGER_DB_BACKUP: ${TRIGGER_DB_BACKUP:-false}
      IMMICH_API_URL: ${IMMICH_API_URL:-}
      IMMICH_API_KEY_FILE: ${IMMICH_API_KEY_FILE:-}
      DB_BACKUP_TRIGGER_TIMEOUT_SECONDS: ${DB_BACKUP_TRIGGER_TIMEOUT_SECONDS:-1800}
      SSH_PORT: ${SSH_PORT:-22}
      SSH_IDENTITY_FILE: ${SSH_IDENTITY_FILE:-}
      RSYNC_SSH_PASSWORD_FILE: ${RSYNC_SSH_PASSWORD_FILE:-}
      RSYNC_DAEMON_PASSWORD_FILE: ${RSYNC_DAEMON_PASSWORD_FILE:-}
      RSYNC_OPTIONS_FILE: ${RSYNC_OPTIONS_FILE:-}
      RSYNC_RSH: ${RSYNC_RSH:-}
      DRY_RUN: ${DRY_RUN:-false}
    volumes:
      - ${UPLOAD_LOCATION:?Set UPLOAD_LOCATION in Immich .env}:/data:ro
      - ${BACKUP_CONFIG_DIR:-./backup-config}:/config:ro
      - ${BACKUP_SECRETS_DIR:-./backup-secrets}:/run/rsync-secrets:ro
    security_opt:
      - no-new-privileges:true
    init: true
